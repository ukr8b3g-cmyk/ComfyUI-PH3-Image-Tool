name: Verify and release

on:
  push:
    branches: [main]
    paths: [pyproject.toml, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ph3-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install test dependencies (runner only)
        run: |
          python -m pip install numpy pillow aiohttp opencv-python-headless
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test and verify package
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/release_package.py --check
          python tools/release_package.py
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" dist/ComfyUI-PH3-Image-Tool-v*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PH3 Image Tool $TAG" \
            --notes-file "docs/releases/$TAG.md"
